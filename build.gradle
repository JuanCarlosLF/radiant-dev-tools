plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

group = 'com.jclopez.radiant.devtools'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    jvmToolchain(24)
}

test {
    useJUnitPlatform()
}